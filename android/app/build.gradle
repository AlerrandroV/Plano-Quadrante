plugins {
    id 'com.android.application'
}

// Assinatura: o Android só aceita instalar uma versão nova POR CIMA da
// antiga se as duas tiverem a mesma chave. Por isso a chave é FIXA:
//  - com os secrets PQ_KEYSTORE_* no GitHub, usa a chave guardada lá;
//  - sem eles, usa android/app/plano-quadrante.jks, que está no repositório.
// Antes, o build caía na chave de debug do runner, que muda a cada build,
// e a atualização dava "conflito com o pacote existente".
def ks = System.getenv('PQ_KEYSTORE_FILE')

android {
    namespace 'io.github.alerrandrov.planoquadrante'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.alerrandrov.planoquadrante'
        minSdk 26
        targetSdk 35
        versionCode((project.findProperty('versionCode') ?: '1').toString().toInteger())
        versionName((project.findProperty('versionName') ?: '0.1.0').toString())
    }

    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('PQ_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PQ_KEY_ALIAS')
                keyPassword System.getenv('PQ_KEY_PASSWORD')
            } else {
                storeFile file('plano-quadrante.jks')
                storePassword 'planoquadrante'
                keyAlias 'planoquadrante'
                keyPassword 'planoquadrante'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            // Mesmo no Android Studio, a mesma chave: dá para alternar entre
            // o APK do GitHub e o instalado pelo cabo sem desinstalar.
            signingConfig signingConfigs.release
        }
    }

    // O jogo (pasta web/ na raiz do repositório) vai dentro do APK.
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    lint {
        // Avisos do lint não devem impedir a geração do APK.
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd-websocket:2.3.1'
}
