plugins {
    id 'com.android.application'
}

// Assinatura: se as variáveis abaixo existirem (CI com secrets), o APK sai
// assinado sempre com a mesma chave, e o Android aceita atualizar o app.
// Sem elas, usa a chave de debug (instala, mas não atualiza por cima de
// uma versão assinada com outra chave).
def ks = System.getenv('PQ_KEYSTORE_FILE')

android {
    namespace 'io.github.alerrandrov.planoquadrante'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.alerrandrov.planoquadrante'
        minSdk 26
        targetSdk 35
        versionCode((project.findProperty('versionCode') ?: '1').toString().toInteger())
        versionName((project.findProperty('versionName') ?: '0.1.0').toString())
    }

    signingConfigs {
        if (ks) {
            release {
                storeFile file(ks)
                storePassword System.getenv('PQ_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PQ_KEY_ALIAS')
                keyPassword System.getenv('PQ_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    // O jogo (pasta web/ na raiz do repositório) vai dentro do APK.
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    lint {
        // Avisos do lint não devem impedir a geração do APK.
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd-websocket:2.3.1'
}
